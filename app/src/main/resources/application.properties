spring.application.name=repit-ma
spring.datasource.url=jdbc:sqlite:${REPIT_MA_DATABASE_PATH:./repit-ma.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/*.xml

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
